<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="980" viewBox="0 0 1120 980" role="img" aria-labelledby="title desc">
  <title id="title">AgentOS 项目架构（目标设计）</title>
  <desc id="desc">CLI、REST 和定时任务共用 AgentService 入口，由自研 ReAct 循环驱动 Spring AI 模型与工具组件。所有 Agent 共享模型接入、记忆、工具治理以及 PostgreSQL 和文件工作区。当前仓库为 Maven 骨架，图示为目标架构。</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .heading { fill: #0f172a; font-size: 27px; font-weight: 700; }
      .label { fill: #475569; font-size: 15px; font-weight: 600; }
      .name { fill: #0f172a; font-size: 18px; font-weight: 700; }
      .detail { fill: #475569; font-size: 14px; }
      .small { fill: #64748b; font-size: 13px; }
      .lane { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .box { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- 自带浅色背景，保证 GitHub 深色和浅色主题下均可阅读 -->
  <rect x="1" y="1" width="1118" height="978" rx="24" fill="#fff" stroke="#e2e8f0"/>
  <rect x="32" y="30" width="6" height="40" rx="3" fill="url(#brand)"/>
  <text x="54" y="57" class="heading">AgentOS · 一个底座，承载多个业务 Agent</text>
  <text x="54" y="83" class="small">目标架构 · JDK 21 / Spring Boot 4 / Spring AI 2.0 · 当前仓库为 Maven 骨架</text>

  <!-- 接入层 -->
  <rect x="32" y="106" width="1056" height="122" rx="16" class="lane"/>
  <text x="52" y="133" class="label">接入层 · 三种触发方式</text>
  <g text-anchor="middle">
    <rect x="56" y="148" width="312" height="60" rx="10" class="box"/>
    <text x="212" y="173" class="name">CLI Channel</text>
    <text x="212" y="195" class="detail">chat · 本地交互与调试</text>
    <rect x="404" y="148" width="312" height="60" rx="10" class="box"/>
    <text x="560" y="173" class="name">Web Service</text>
    <text x="560" y="195" class="detail">REST API · 业务系统集成</text>
    <rect x="752" y="148" width="312" height="60" rx="10" class="box"/>
    <text x="908" y="173" class="name">AgentScheduler</text>
    <text x="908" y="195" class="detail">cron · ShedLock 防止任务重叠</text>
  </g>
  <path d="M212 208 V242 H446 V258" class="flow"/>
  <path d="M560 208 V258" class="flow"/>
  <path d="M908 208 V242 H674 V258" class="flow"/>

  <!-- 统一入口 -->
  <rect x="344" y="260" width="432" height="58" rx="14" fill="url(#brand)"/>
  <text x="560" y="284" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">AgentService.process(...)</text>
  <text x="560" y="306" text-anchor="middle" fill="#ccfbf1" font-size="13">会话租约 · 轮次生命周期 · TurnContext</text>
  <path d="M560 318 V352" class="flow"/>

  <!-- 引擎层 -->
  <rect x="32" y="354" width="1056" height="126" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="52" y="382" class="label">引擎层 · 自研循环，复用 Spring AI 官方组件</text>
  <g text-anchor="middle">
    <rect x="56" y="398" width="312" height="60" rx="10" class="box"/>
    <text x="212" y="423" class="name">PromptBuilder</text>
    <text x="212" y="445" class="detail">指令 / Skill 元数据 / 记忆 / 历史</text>
    <rect x="404" y="398" width="312" height="60" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="560" y="423" class="name">ReActLoop</text>
    <text x="560" y="445" class="detail">模型 → 工具 → 结果 → 下一次迭代</text>
    <rect x="752" y="398" width="312" height="60" rx="10" class="box"/>
    <text x="908" y="423" class="name">ToolExecutor</text>
    <text x="908" y="445" class="detail">注入的 ToolCallingManager</text>
  </g>
  <path d="M368 428 H402" class="flow"/>
  <path d="M716 428 H750" class="flow"/>
  <text x="560" y="508" text-anchor="middle" class="small">两道调用上限 · 四层超时 · 同步 / 流式输出 · 逐次迭代审计</text>

  <!-- 能力层：共享服务不绑定具体业务 Agent -->
  <rect x="32" y="526" width="1056" height="154" rx="16" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="52" y="554" class="label">共享能力层</text>
  <g text-anchor="middle">
    <rect x="56" y="570" width="312" height="88" rx="10" class="box"/>
    <text x="212" y="596" class="name">ProviderService</text>
    <text x="212" y="621" class="detail">ChatModel · EmbeddingModel</text>
    <text x="212" y="643" class="small">具名 Provider 映射 · 超时与重试</text>
    <rect x="404" y="570" width="312" height="88" rx="10" class="box"/>
    <text x="560" y="596" class="name">MemoryService</text>
    <text x="560" y="621" class="detail">会话记忆 · 长期记忆</text>
    <text x="560" y="643" class="small">SessionManager · LongTermMemoryStore</text>
    <rect x="752" y="570" width="312" height="88" rx="10" class="box"/>
    <text x="908" y="596" class="name">ToolRegistry · ToolCallback</text>
    <text x="908" y="621" class="detail">内置工具 / @Tool Bean / MCP 工具</text>
    <text x="908" y="643" class="small">GovernedToolCallback · Sandbox</text>
  </g>

  <!-- 模型与工具通过各自的协议访问外部系统 -->
  <path d="M212 658 V708" class="flow"/>
  <path d="M908 658 V708" class="flow"/>
  <rect x="56" y="710" width="312" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="212" y="742" text-anchor="middle" class="detail">LLM / Embedding 服务（本地或远程）</text>
  <rect x="752" y="710" width="312" height="54" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-dasharray="5 4"/>
  <text x="908" y="742" text-anchor="middle" class="detail">文件 / HTTP / 子进程 / MCP server</text>
  <path d="M560 658 V794" class="flow"/>
  <text x="560" y="737" text-anchor="middle" class="small">读取上下文与持久化状态</text>

  <!-- 存储横切全链路，审计不只属于 Memory -->
  <rect x="32" y="796" width="1056" height="146" rx="16" class="lane"/>
  <text x="52" y="824" class="label">存储与工作区 · 支撑整条处理链路</text>
  <rect x="56" y="840" width="490" height="80" rx="10" class="box"/>
  <text x="76" y="867" class="name">PostgreSQL + pgvector</text>
  <text x="76" y="891" class="detail">会话 / 轮次 / 消息 / 调度 / llm_calls / tool_invocations</text>
  <text x="76" y="911" class="small">知识库、记忆与工具向量 · Flyway 管理表结构</text>
  <rect x="574" y="840" width="490" height="80" rx="10" class="box"/>
  <text x="594" y="867" class="name">.AgentOS/ 文件工作区</text>
  <text x="594" y="891" class="detail">AGENT.md / Bootstrap / Skills / MEMORY.md</text>
  <text x="594" y="911" class="small">用户维护的指令、资源与配置 · 按需加载</text>
  <text x="560" y="965" text-anchor="middle" class="small">白名单沙箱在内置工具中检查；MCP 工具的隔离由服务端负责。</text>
</svg>
