<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">AgentOS</title>
  <desc id="desc">AgentOS 标志：中间的六边形内核通过同一条轨道承载三个 Agent，表示一个底座运行一群 Agent。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- 底板：自带背景色，深色和浅色主题下都清晰 -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- 共享轨道：所有 Agent 共用的底座能力 -->
  <circle cx="128" cy="128" r="78" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"/>

  <!-- 内核与 Agent 之间的连接 -->
  <g stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="8" stroke-linecap="round">
    <line x1="128" y1="128" x2="128" y2="50"/>
    <line x1="128" y1="128" x2="60.45" y2="167"/>
    <line x1="128" y1="128" x2="195.55" y2="167"/>
  </g>

  <!-- 内核：六边形 -->
  <polygon points="128,94 157.44,111 157.44,145 128,162 98.56,145 98.56,111" fill="#FFFFFF"/>
  <circle cx="128" cy="128" r="11" fill="#1E3A8A"/>

  <!-- 三个 Agent -->
  <g fill="url(#node)" stroke="#FFFFFF" stroke-width="6">
    <circle cx="128" cy="50" r="17"/>
    <circle cx="60.45" cy="167" r="17"/>
    <circle cx="195.55" cy="167" r="17"/>
  </g>
</svg>
