# AgentOS 配置，键名与取值见技术方案 3.2、3.4、3.5、4.3、8.8。
# 密钥一律用 ${ENV_VAR} 占位，本地开发从仓库根目录的 .env 读取（模板见 .env.example）。
spring:
  application:
    name: AgentOS
  config:
    import: optional:file:.env[.properties]
  lifecycle:
    timeout-per-shutdown-phase: 70s        # 大于 agentos.shutdown.turn-grace（60s），优雅停机时等轮次收尾
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AGENTOS_DB_URL}
    username: ${AGENTOS_DB_USERNAME}
    password: ${AGENTOS_DB_PASSWORD}
  jpa:
    open-in-view: false                    # 避免 HTTP 请求期间占住数据库连接，见 9.1
    hibernate:
      ddl-auto: validate                   # 表结构只由 Flyway 管理
  flyway:
    placeholders:
      embeddingDimensions: ${AGENTOS_EMBEDDING_DIMENSIONS:1024}
  docker:
    compose:
      enabled: false                       # 使用项目方提供的 PostgreSQL
  ai:
    model:
      embedding: none                      # Embedding 只走 agentos.embedding，见 3.4
    retry:
      max-attempts: 1                      # 关闭模型实现内置重试（2.0.2 默认 10 次），重试归 ProviderService，见 3.1
    openai:                                # Starter 自动配置的辅助模型，与 primary 相同，见 1.3
      base-url: ${AGENTOS_LLM_BASE_URL}
      api-key: ${AGENTOS_LLM_API_KEY}
      chat:
        model: ${AGENTOS_LLM_MODEL}
    mcp:
      client:
        enabled: false                     # MCP 客户端由 McpClientService 编程式创建，见 6.4
    chat:
      observations:
        log-prompt: false                  # prompt / 回复可能含密钥和用户数据，不进日志
        log-completion: false
      client:
        tool-calling:
          enabled: false                   # 关闭 ToolCallingAdvisor 自动注册，工具只经 ToolExecutor 执行
    tools:
      observations:
        include-content: false             # 工具参数和结果不导出到 Span，审计以 tool_invocations 为准（技术方案 6.1）
      limits:                              # 单轮工具调用上限，见 4.3
        max-calls-per-tool-default: 10
        max-calls-per-tool:
          notify: 3
        max-total-tool-calls: 30
        on-limit-exceeded: RETURN_ERROR_RESPONSE

# HTTP Server：Spring MVC + virtual thread（spring.threads.virtual.enabled 已开），见技术方案 7.1
server:
  port: 8080
  shutdown: graceful

# 日志：控制台给人看（chat 模式下保持可读），文件写 ECS JSON 给机器看
# MDC 约定键：sessionId、turnId、agent、iteration，由 ReActLoop 在每轮开始时写入、结束时清理
logging:
  file:
    name: .AgentOS/logs/agentos.log
  structured:
    format:
      file: ecs
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 1GB

# 监控：核心阶段只暴露健康检查；Prometheus 指标导出放扩展阶段（技术方案 1.2）
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never                  # 无认证，不暴露数据库等组件细节
      probes:
        enabled: true                      # /actuator/health/liveness、/readiness
  observations:
    key-values:
      application: AgentOS

agentos:
  default-provider: primary
  providers:
    primary:
      type: openai
      base-url: ${AGENTOS_LLM_BASE_URL}
      api-key: ${AGENTOS_LLM_API_KEY}
      model: ${AGENTOS_LLM_MODEL}
      reasoning-effort: low
      timeout: 120s
  embedding:
    enabled: ${AGENTOS_EMBEDDING_ENABLED:true}
    base-url: ${AGENTOS_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    api-key: ${AGENTOS_EMBEDDING_API_KEY:}
    model: ${AGENTOS_EMBEDDING_MODEL:text-embedding-v4}
    dimensions: ${AGENTOS_EMBEDDING_DIMENSIONS:1024}
    max-batch-size: 10                     # 百炼单次最多 10 条，见 3.4
    timeout: 30s
  web:
    sync-wait: 60s
  shutdown:
    turn-grace: 60s
