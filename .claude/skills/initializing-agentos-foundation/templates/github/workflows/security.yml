# 安全扫描：gitleaks（密钥泄露）+ CodeQL（源码漏洞）。文档改动也要扫密钥，所以不设 paths-ignore
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'                   # 每周一全量扫一次
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # 个人仓库不需要 GITLEAKS_LICENSE；组织仓库要去 gitleaks.io 申请免费 license

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none                 # 不跑 Maven 构建，直接分析源码
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
